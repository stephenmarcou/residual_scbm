experiment_name: 'experiments' # Name of the experiment
experiment_dir: './experiments/'  # Directory to potentially save the model to

seed: 0 # Random seed
workers: 2 # Number of workers for data loading
save_model: False # Whether to save the model. Set to True for inspecting models post training [True, False]
train_only: False # Whether to train the model only and exit before performing interventions [True, False]
incomplete: False # Whether to train on an incomplete concept set (select it with data.pkl_file_dir) [True, False]
run_inference: False # Whether inference.py evaluates the model on eval_split [True, False]
run_interventions: False # Whether inference.py computes the intervention curve [True, False]
num_attribute_groups_remove: 14 # Number of attribute groups to remove when creating incomplete datasets. Only used if incomplete is True. Should be between 0 and 28 for CUB.
remove_attribute_groups: False # Whether to create an incomplete dataset by removing entire attribute groups, or by randomly removing individual attributes across groups. Only used if incomplete is True. [True, False]
ratio_attributes_remove: 0.5 # Ratio of attributes to remove when creating incomplete datasets by randomly removing individual attributes across groups. Only used if incomplete is True and remove_attribute_groups is False. Should be between 0 and 1.
hyperparameter_search: False # Whether to perform hyperparameter search by evaluating the model on the validation set at the end of training and returning the validation metrics without performing inference or interventions [True, False]
save_name: null # Optional name to add as a prefix to the saved model and the wandb run.


logging:
  project: 'SCBM' # Name of the wandb project
  mode: 'disabled' # Whether to log to wandb [online, offline, disabled]
  entity: "your_entity" # Your wandb entity

inference:
  ex_name: null # Name of the run folder to load (under experiment_dir/<model>/<dataset>/)
  save_intervention_predictions: False # Whether to dump the per-sample predictions behind every point of the
                                       # intervention curve to <run>/intervention_preds<suffix>/<strategy>_<policy>/
                                       # (step_<n>.pt plus y_true / c_true / img_ids written once). [True, False]
  inter_policy: 'random' # What each intervention step adds ['random', 'random_group'].
                         # 'random': one random not-yet-intervened concept per sample and step
                         # (x-axis = number of concepts).
                         # 'random_group': one complete semantic concept group per step, drawn at random
                         # per batch (CUB: the 28 attribute parts; AwA2: the 28 CEM groups), so the
                         # x-axis counts groups. On an incomplete run, partially removed groups keep
                         # their surviving concepts. Writes intervention_log<split>_random_group.txt.
  propagate_to_residual: True # SCBM_RES only: whether a concept intervention is propagated to the residual
                              # channel [True, False]. True is the standard SCBM behaviour (conditioning the
                              # joint Gaussian moves the residuals too). False keeps the residual draws of the
                              # zero-intervention pass fixed along the whole curve, so only the concept channel
                              # moves. Writes intervention_log<split>_no_res_prop.txt.
  eval_split: 'test' # Which split to evaluate (and intervene) on ['test', 'val', 'train'].
                     # Non-'test' splits write to inference_log_<split>.txt / intervention_log_<split>.txt.
  noise: # Post-hoc robustness check: corrupt the images of the *evaluation* split only (no retraining;
         # the intervention strategy is still fitted on the clean train split). CUB only.
         # Applied in [0,1] pixel space before ImageNet normalization, deterministic per (seed, sample).
         # Logs and artifacts get the suffix _noise_<type>_<amount>.
    type: null # [null, 'salt_pepper', 'gaussian']. null = clean evaluation.
    amount: 0.05 # salt_pepper: strength lambda of Espinosa Zarlenga et al. (ICML 2025, App. G): lambda/2 of the
                 # pixel channels set to max, then lambda/2 set to min. Their default is 0.1.
                 # gaussian: std of additive noise in [0,1] pixel units (clipped).
    seed: 0 # Seed of the corruption, independent of the global seed so two checkpoints see identical noise.
