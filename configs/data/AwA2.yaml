# --------------------------
#         Dataset
# --------------------------
defaults:
  - data_defaults # Inherit data_defaults arguments
dataset: 'AwA2' # Name of the dataset
num_classes: 50 # Number of the classes of the target variable
num_concepts: 85 # Number of concepts in dataset (the binary predicate matrix columns).
                 # An incomplete split reduces it; it is then read back from the split's info.json.
num_residuals: 30 # Number of residuals

# --------------------------
#           Split
# --------------------------
seed: ${seed} # Seed of the random image-level 60/20/20 split. Only used while
              # <data_path>/AwA2/{train,val,test}_split.npz do not yet exist - once written,
              # those files define the split. Delete them to force a new split.

# --------------------------
#       Saving outputs
# --------------------------
save_concept_and_residual_channel: false # Whether to save the predicted concepts and residuals for each data point, for post-hoc analysis

# Incomplete dataset parameters
# Incomplete AwA2 splits only reduce the concept matrix; the images and labels are unchanged.
# They live in <data_path>/AwA2/<incomplete_dir>/<folder>/. Create one with
# datasets.awa2_dataset.create_custom_incomplete_dataset (or the random variants) and pass the
# folder here. incomplete=True with an unset pkl_file_dir is an error.
pkl_file_dir: null # Folder of the incomplete concept set (relative to <data_path>/AwA2/<incomplete_dir>)
